services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aplicativo-expo
    working_dir: /app
    command: ["npx", "expo", "start", "--host", "lan"]
    ports:
      - "8081:8081"
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:?REACT_NATIVE_PACKAGER_HOSTNAME nao foi definido}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - expo_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  expo_node_modules:
